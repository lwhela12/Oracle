<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Oracle</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #13131a;
            --bg-tertiary: #1a1a24;
            --accent-primary: #8b5cf6;
            --accent-secondary: #a78bfa;
            --accent-glow: rgba(139, 92, 246, 0.3);
            --text-primary: #e9edef;
            --text-secondary: #a0a8b0;
            --text-muted: #6b7280;
            --border-color: rgba(139, 92, 246, 0.2);
            --glass-bg: rgba(26, 26, 36, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-glow: 0 0 30px rgba(139, 92, 246, 0.15);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --sidebar-width: 280px;
            --header-height: 80px;
        }

        [data-theme="light"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f3f5;
            --accent-primary: #7c3aed;
            --accent-secondary: #8b5cf6;
            --accent-glow: rgba(124, 58, 237, 0.2);
            --text-primary: #1a1a24;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --border-color: rgba(124, 58, 237, 0.2);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(124, 58, 237, 0.2);
            --shadow-glow: 0 0 30px rgba(124, 58, 237, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Header */
        .header {
            height: var(--header-height);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-logo h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-logo-icon {
            font-size: 2rem;
        }

        .header-controls {
            display: flex;
            gap: 0.75rem;
        }

        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.3s ease;
        }

        .header-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .header-btn.muted {
            opacity: 0.5;
        }

        .hamburger {
            display: none;
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            height: calc(100vh - var(--header-height));
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        .sidebar-section {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-section-title {
            font-family: 'Cinzel', serif;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .divination-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .divination-btn {
            padding: 0.875rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9375rem;
            color: var(--text-primary);
        }

        .divination-btn:hover {
            background: var(--glass-bg);
            border-color: var(--accent-primary);
            transform: translateX(4px);
        }

        .divination-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .divination-icon {
            font-size: 1.5rem;
        }

        .spread-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .spread-btn {
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.875rem;
            color: var(--text-primary);
            text-align: left;
        }

        .spread-btn:hover {
            background: var(--glass-bg);
            border-color: var(--accent-secondary);
        }

        .spread-btn.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-color: var(--accent-primary);
            color: white;
        }

        .template-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .template-btn {
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-align: left;
        }

        .template-btn:hover {
            background: var(--glass-bg);
            border-color: var(--accent-secondary);
            color: var(--text-primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chat-message {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            align-self: flex-end;
            background: var(--accent-primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .thinking-animation {
            display: none;
            align-self: flex-start;
            padding: 1rem 1.25rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
        }

        .thinking-dots {
            display: flex;
            gap: 6px;
        }

        .thinking-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-primary);
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-area {
            padding: 1.5rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-container {
            flex: 1;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .selection-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .selection-pill {
            padding: 0.375rem 0.75rem;
            background: var(--accent-primary);
            color: white;
            border-radius: 20px;
            font-size: 0.8125rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .selection-pill-remove {
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .selection-pill-remove:hover {
            opacity: 1;
        }

        .input-field {
            width: 100%;
            padding: 1rem 1.25rem;
            background: var(--bg-tertiary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            resize: vertical;
            min-height: 60px;
            max-height: 150px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .generate-btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-glow);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--accent-glow);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Card Viewer Panel */
        .card-viewer-panel {
            width: 400px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            position: relative;
        }

        .card-viewer-panel.minimized {
            transform: translateX(100%);
        }

        .card-viewer-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-viewer-title {
            font-family: 'Cinzel', serif;
            font-size: 1.125rem;
            font-weight: 600;
        }

        .minimize-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .minimize-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .card-viewer-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .cards-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Floating Expand Button */
        .expand-btn {
            position: fixed;
            right: 2rem;
            bottom: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.3s ease;
            z-index: 50;
        }

        .expand-btn.visible {
            display: flex;
        }

        .expand-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px var(--accent-glow);
        }

        .expand-btn-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* Tarot Card Styling */
        .tarot-card-wrapper {
            perspective: 1000px;
            width: 140px;
            height: 240px;
        }

        .tarot-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer;
        }

        .tarot-card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-shadow: var(--shadow-sm);
        }

        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-front {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            transform: rotateY(180deg);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }

        .card-name {
            font-family: 'Cinzel', serif;
            font-size: 0.875rem;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .card-position {
            font-size: 0.75rem;
            color: #7f8c8d;
            text-align: center;
            font-style: italic;
        }

        .card-suit {
            font-size: 0.75rem;
            color: #7f8c8d;
            margin-top: 0.25rem;
        }

        /* Hexagram Display */
        .hexagram-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .hexagram-lines {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hexagram-line {
            width: 160px;
            height: 12px;
            background: var(--accent-primary);
            border-radius: 6px;
        }

        .hexagram-line.broken {
            background: linear-gradient(to right, var(--accent-primary) 0%, var(--accent-primary) 40%, transparent 40%, transparent 60%, var(--accent-primary) 60%, var(--accent-primary) 100%);
        }

        .hexagram-info {
            text-align: center;
        }

        .hexagram-number {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
        }

        .hexagram-name {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .hexagram-chinese {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .hexagram-translation {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Runes Display */
        .runes-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .rune-stone {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .rune-symbol {
            font-size: 2.5rem;
        }

        .rune-name {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 600;
        }

        .rune-position {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .rune-meaning {
            font-size: 0.8125rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Export Button */
        .export-btn {
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .export-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
        }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .card-viewer-panel {
                position: fixed;
                right: 0;
                top: var(--header-height);
                height: calc(100vh - var(--header-height));
                z-index: 90;
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.3);
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 0 1rem;
            }

            .header-logo h1 {
                font-size: 1.25rem;
            }

            .hamburger {
                display: flex;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: var(--header-height);
                height: calc(100vh - var(--header-height));
                z-index: 95;
                transform: translateX(-100%);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .chat-area {
                padding: 1rem;
            }

            .chat-message {
                max-width: 90%;
            }

            .input-area {
                padding: 1rem;
            }

            .input-wrapper {
                flex-direction: column;
                gap: 0.75rem;
            }

            .generate-btn {
                width: 100%;
            }

            .card-viewer-panel {
                width: 100%;
            }

            .expand-btn {
                right: 1rem;
                bottom: 1rem;
            }

            .tarot-card-wrapper {
                width: 120px;
                height: 200px;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-logo">
            <button class="header-btn hamburger" id="hamburger">☰</button>
            <span class="header-logo-icon">🔮</span>
            <h1>Quantum Oracle</h1>
        </div>
        <div class="header-controls">
            <button class="header-btn" id="themeToggle">🌙</button>
            <button class="header-btn" id="soundToggle">🔊</button>
            <button class="header-btn muted" id="musicToggle">🎶</button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- Divination Type Section -->
            <div class="sidebar-section">
                <h3 class="sidebar-section-title">Divination Type</h3>
                <div class="divination-options">
                    <button class="divination-btn active" data-type="tarot">
                        <span class="divination-icon">🃏</span>
                        <span>Tarot Cards</span>
                    </button>
                    <button class="divination-btn" data-type="iching">
                        <span class="divination-icon">☯️</span>
                        <span>I Ching</span>
                    </button>
                    <button class="divination-btn" data-type="runes">
                        <span class="divination-icon">ᚱ</span>
                        <span>Elder Runes</span>
                    </button>
                </div>
            </div>

            <!-- Spread Type Section (Tarot only) -->
            <div class="sidebar-section" id="spreadSection">
                <h3 class="sidebar-section-title">Spread Type</h3>
                <div class="spread-options">
                    <button class="spread-btn active" data-spread="3-card">3-Card Spread</button>
                    <button class="spread-btn" data-spread="yes-no">Yes/No Reading</button>
                    <button class="spread-btn" data-spread="5-card">5-Card Cross</button>
                    <button class="spread-btn" data-spread="celtic">Celtic Cross</button>
                </div>
            </div>

            <!-- Quick Templates -->
            <div class="sidebar-section">
                <h3 class="sidebar-section-title">Quick Templates</h3>
                <div class="template-options">
                    <button class="template-btn" data-template="What guidance do you have for me today?">📖 Daily Guidance</button>
                    <button class="template-btn" data-template="What do I need to know about my love life?">💖 Love & Romance</button>
                    <button class="template-btn" data-template="What should I know about my career path?">💼 Career Path</button>
                    <button class="template-btn" data-template="What do I need to focus on for spiritual growth?">✨ Spiritual Growth</button>
                    <button class="template-btn" data-template="What obstacles should I be aware of?">🛡️ Challenges Ahead</button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Chat Area -->
            <div class="chat-area" id="chatArea">
                <!-- Messages will be added here -->
                <div class="thinking-animation" id="thinkingAnimation">
                    <div class="thinking-dots">
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <div class="input-container">
                        <label class="input-label">Your Question</label>
                        <div class="selection-pills" id="selectionPills"></div>
                        <textarea
                            class="input-field"
                            id="userInput"
                            placeholder="Ask your question or describe what guidance you seek..."
                            rows="1"
                        ></textarea>
                    </div>
                    <button class="generate-btn" id="generateBtn">
                        Generate Reading
                    </button>
                </div>
            </div>
        </main>

        <!-- Card Viewer Panel -->
        <aside class="card-viewer-panel" id="cardViewerPanel">
            <div class="card-viewer-header">
                <h2 class="card-viewer-title">Reading</h2>
                <button class="minimize-btn" id="minimizeBtn">→</button>
            </div>
            <div class="card-viewer-content" id="cardViewerContent">
                <div class="empty-state">
                    <div class="empty-state-icon">🔮</div>
                    <p>Your cards, hexagrams, or runes will appear here after generating a reading.</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Floating Expand Button -->
    <button class="expand-btn" id="expandBtn">
        🔮
        <span class="expand-btn-badge" id="expandBadge" style="display: none;"></span>
    </button>

    <script>
        // State Management
        let currentDivinationType = 'tarot';
        let currentSpreadType = '3-card';
        let soundEnabled = true;
        let musicEnabled = false;
        let audioContext = null;
        let ambientOscillator = null;
        let currentReading = null;
        let sidebarOpen = false;

        // DOM Elements
        const hamburger = document.getElementById('hamburger');
        const sidebar = document.getElementById('sidebar');
        const themeToggle = document.getElementById('themeToggle');
        const soundToggle = document.getElementById('soundToggle');
        const musicToggle = document.getElementById('musicToggle');
        const chatArea = document.getElementById('chatArea');
        const thinkingAnimation = document.getElementById('thinkingAnimation');
        const userInput = document.getElementById('userInput');
        const generateBtn = document.getElementById('generateBtn');
        const selectionPills = document.getElementById('selectionPills');
        const cardViewerPanel = document.getElementById('cardViewerPanel');
        const cardViewerContent = document.getElementById('cardViewerContent');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const expandBtn = document.getElementById('expandBtn');
        const expandBadge = document.getElementById('expandBadge');
        const spreadSection = document.getElementById('spreadSection');

        // Audio System
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        const sounds = {
            cardFlip: () => {
                if (!soundEnabled) return;
                initAudio();
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 400;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                osc.start();
                osc.stop(audioContext.currentTime + 0.2);
            },

            cardShuffle: () => {
                if (!soundEnabled) return;
                initAudio();
                [300, 350, 400].forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.08, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                        osc.start();
                        osc.stop(audioContext.currentTime + 0.15);
                    }, i * 50);
                });
            },

            messageSend: () => {
                if (!soundEnabled) return;
                initAudio();
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 600;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                osc.start();
                osc.stop(audioContext.currentTime + 0.15);
            },

            chime: () => {
                if (!soundEnabled) return;
                initAudio();
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.12, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);
                        osc.start();
                        osc.stop(audioContext.currentTime + 0.8);
                    }, i * 100);
                });
            }
        };

        // Ambient Music
        function startAmbientMusic() {
            if (!musicEnabled || ambientOscillator) return;
            initAudio();

            ambientOscillator = {
                osc1: audioContext.createOscillator(),
                osc2: audioContext.createOscillator(),
                gain: audioContext.createGain()
            };

            ambientOscillator.osc1.frequency.value = 110;
            ambientOscillator.osc2.frequency.value = 165;
            ambientOscillator.osc1.type = 'sine';
            ambientOscillator.osc2.type = 'sine';
            ambientOscillator.gain.gain.value = 0.03;

            ambientOscillator.osc1.connect(ambientOscillator.gain);
            ambientOscillator.osc2.connect(ambientOscillator.gain);
            ambientOscillator.gain.connect(audioContext.destination);

            ambientOscillator.osc1.start();
            ambientOscillator.osc2.start();

            setInterval(() => {
                if (ambientOscillator && musicEnabled) {
                    ambientOscillator.osc1.frequency.value = 110 + Math.sin(Date.now() / 3000) * 5;
                    ambientOscillator.osc2.frequency.value = 165 + Math.cos(Date.now() / 4000) * 7;
                }
            }, 100);
        }

        function stopAmbientMusic() {
            if (ambientOscillator) {
                ambientOscillator.osc1.stop();
                ambientOscillator.osc2.stop();
                ambientOscillator = null;
            }
        }

        // Toggle Functions
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            themeToggle.textContent = newTheme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            soundToggle.classList.toggle('muted');
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
            localStorage.setItem('soundEnabled', soundEnabled);
            if (soundEnabled) sounds.chime();
        }

        function toggleMusic() {
            musicEnabled = !musicEnabled;
            musicToggle.classList.toggle('muted');
            musicToggle.textContent = musicEnabled ? '🎵' : '🎶';
            localStorage.setItem('musicEnabled', musicEnabled);

            if (musicEnabled) {
                startAmbientMusic();
            } else {
                stopAmbientMusic();
            }
        }

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            sidebar.classList.toggle('open');
        }

        // Divination Type Selection
        document.querySelectorAll('.divination-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentDivinationType = btn.dataset.type;
                document.querySelectorAll('.divination-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Show/hide spread section based on divination type
                if (currentDivinationType === 'tarot') {
                    spreadSection.style.display = 'block';
                } else {
                    spreadSection.style.display = 'none';
                }

                updateSelectionPills();
                sounds.chime();
            });
        });

        // Spread Type Selection
        document.querySelectorAll('.spread-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentSpreadType = btn.dataset.spread;
                document.querySelectorAll('.spread-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateSelectionPills();
                sounds.chime();
            });
        });

        // Template Buttons
        document.querySelectorAll('.template-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                userInput.value = btn.dataset.template;
                userInput.focus();
            });
        });

        // Update Selection Pills
        function updateSelectionPills() {
            selectionPills.innerHTML = '';

            const divinationTypeLabels = {
                'tarot': '🃏 Tarot',
                'iching': '☯️ I Ching',
                'runes': 'ᚱ Runes'
            };

            const pill1 = document.createElement('div');
            pill1.className = 'selection-pill';
            pill1.innerHTML = `<span>${divinationTypeLabels[currentDivinationType]}</span>`;
            selectionPills.appendChild(pill1);

            if (currentDivinationType === 'tarot') {
                const spreadLabels = {
                    '3-card': '3-Card Spread',
                    'yes-no': 'Yes/No',
                    '5-card': '5-Card Cross',
                    'celtic': 'Celtic Cross'
                };

                const pill2 = document.createElement('div');
                pill2.className = 'selection-pill';
                pill2.innerHTML = `<span>${spreadLabels[currentSpreadType]}</span>`;
                selectionPills.appendChild(pill2);
            }
        }

        // Card Viewer Panel Controls
        minimizeBtn.addEventListener('click', () => {
            cardViewerPanel.classList.add('minimized');
            expandBtn.classList.add('visible');
            if (currentReading) {
                expandBadge.style.display = 'flex';
                expandBadge.textContent = '!';
            }
        });

        expandBtn.addEventListener('click', () => {
            cardViewerPanel.classList.remove('minimized');
            expandBtn.classList.remove('visible');
            expandBadge.style.display = 'none';
        });

        // Hamburger Menu
        hamburger.addEventListener('click', toggleSidebar);

        // Event Listeners
        themeToggle.addEventListener('click', toggleTheme);
        soundToggle.addEventListener('click', toggleSound);
        musicToggle.addEventListener('click', toggleMusic);

        // Generate Button
        generateBtn.addEventListener('click', sendMessage);

        // Enter key to send
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Chat Functions
        function addMessage(message, isUser) {
            const messageElement = document.createElement('div');
            messageElement.classList.add(isUser ? 'user-message' : 'bot-message', 'chat-message');

            if (isUser) {
                messageElement.textContent = message;
            } else {
                messageElement.innerHTML = marked.parse(message);
            }

            chatArea.insertBefore(messageElement, thinkingAnimation);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showThinkingAnimation() {
            thinkingAnimation.style.display = 'flex';
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideThinkingAnimation() {
            thinkingAnimation.style.display = 'none';
        }

        // Card Icons
        function getCardIcon(card) {
            if (card.arcana === 'major') {
                const majorIcons = {
                    'The Fool': '🃏', 'The Magician': '🎩', 'The High Priestess': '👸',
                    'The Empress': '👑', 'The Emperor': '🤴', 'The Hierophant': '⛪',
                    'The Lovers': '💑', 'The Chariot': '🏇', 'Strength': '🦁',
                    'The Hermit': '🏮', 'Wheel of Fortune': '☸️', 'Justice': '⚖️',
                    'The Hanged Man': '🙃', 'Death': '💀', 'Temperance': '🍷',
                    'The Devil': '😈', 'The Tower': '🗼', 'The Star': '⭐',
                    'The Moon': '🌙', 'The Sun': '☀️', 'Judgement': '📯', 'The World': '🌍'
                };
                return majorIcons[card.name] || '✦';
            } else {
                const suitIcons = {
                    'Wands': '🔥',
                    'Cups': '🏆',
                    'Swords': '⚔️',
                    'Pentacles': '⭐'
                };
                return suitIcons[card.suit] || '✦';
            }
        }

        // Display Tarot Cards
        function displayTarotCards(cards, positions) {
            cardViewerContent.innerHTML = '';
            const cardsDisplay = document.createElement('div');
            cardsDisplay.className = 'cards-display';

            sounds.cardShuffle();

            cards.forEach((card, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tarot-card-wrapper';

                const cardElement = document.createElement('div');
                cardElement.className = 'tarot-card';
                cardElement.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <div class="card-icon">${getCardIcon(card)}</div>
                        <div class="card-name">${card.name}</div>
                        <div class="card-position">${positions[index]}</div>
                        ${card.suit ? `<div class="card-suit">${card.suit}</div>` : ''}
                    </div>
                `;

                wrapper.appendChild(cardElement);
                cardsDisplay.appendChild(wrapper);

                // Auto-flip cards with delay
                setTimeout(() => {
                    cardElement.classList.add('flipped');
                    sounds.cardFlip();
                }, 500 + (index * 300));

                // Click to flip
                cardElement.addEventListener('click', () => {
                    cardElement.classList.toggle('flipped');
                    sounds.cardFlip();
                });
            });

            // Add export button
            const exportBtn = document.createElement('button');
            exportBtn.className = 'export-btn';
            exportBtn.innerHTML = '📸 Export Reading';
            exportBtn.addEventListener('click', exportReading);
            cardsDisplay.appendChild(exportBtn);

            cardViewerContent.appendChild(cardsDisplay);

            // Show panel if minimized
            if (cardViewerPanel.classList.contains('minimized')) {
                expandBadge.style.display = 'flex';
                expandBadge.textContent = cards.length;
            }
        }

        // Display Hexagram
        function displayHexagram(hexagram) {
            cardViewerContent.innerHTML = '';
            const hexagramContainer = document.createElement('div');
            hexagramContainer.className = 'hexagram-container';

            const linesDiv = document.createElement('div');
            linesDiv.className = 'hexagram-lines';

            hexagram.lines.forEach(line => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'hexagram-line' + (line === 6 || line === 8 ? '' : ' broken');
                linesDiv.appendChild(lineDiv);
            });

            const infoDiv = document.createElement('div');
            infoDiv.className = 'hexagram-info';
            infoDiv.innerHTML = `
                <div class="hexagram-number">#${hexagram.number}</div>
                <div class="hexagram-name">${hexagram.name}</div>
                <div class="hexagram-chinese">${hexagram.chinese}</div>
                <div class="hexagram-translation">${hexagram.translation}</div>
            `;

            hexagramContainer.appendChild(linesDiv);
            hexagramContainer.appendChild(infoDiv);

            const exportBtn = document.createElement('button');
            exportBtn.className = 'export-btn';
            exportBtn.innerHTML = '📸 Export Reading';
            exportBtn.addEventListener('click', exportReading);

            cardViewerContent.appendChild(hexagramContainer);
            cardViewerContent.appendChild(exportBtn);

            if (cardViewerPanel.classList.contains('minimized')) {
                expandBadge.style.display = 'flex';
                expandBadge.textContent = '!';
            }
        }

        // Display Runes
        function displayRunes(runes, positions) {
            cardViewerContent.innerHTML = '';
            const runesContainer = document.createElement('div');
            runesContainer.className = 'runes-container';

            runes.forEach((rune, index) => {
                const runeStone = document.createElement('div');
                runeStone.className = 'rune-stone';
                runeStone.innerHTML = `
                    <div class="rune-symbol">${rune.symbol}</div>
                    <div class="rune-name">${rune.name}</div>
                    <div class="rune-position">${positions[index]}</div>
                    <div class="rune-meaning">${rune.meaning}</div>
                `;

                runesContainer.appendChild(runeStone);

                setTimeout(() => {
                    runeStone.style.opacity = '0';
                    runeStone.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        runeStone.style.transition = 'all 0.5s ease-out';
                        runeStone.style.opacity = '1';
                        runeStone.style.transform = 'scale(1)';
                        sounds.cardFlip();
                    }, 100);
                }, index * 200);
            });

            const exportBtn = document.createElement('button');
            exportBtn.className = 'export-btn';
            exportBtn.innerHTML = '📸 Export Reading';
            exportBtn.addEventListener('click', exportReading);

            cardViewerContent.appendChild(runesContainer);
            cardViewerContent.appendChild(exportBtn);

            if (cardViewerPanel.classList.contains('minimized')) {
                expandBadge.style.display = 'flex';
                expandBadge.textContent = runes.length;
            }
        }

        // Send Message
        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (!messageText) return;

            // Ensure the message includes the divination type keyword for backend routing
            let enhancedMessage = messageText;

            // Check if message already contains divination keywords
            const hasTarotKeyword = /tarot/i.test(messageText);
            const hasIChingKeyword = /(i ching|iching|hexagram)/i.test(messageText);
            const hasRunesKeyword = /(rune|runes|futhark|norse)/i.test(messageText);

            // If no divination keyword is present, prepend the selected type
            if (!hasTarotKeyword && !hasIChingKeyword && !hasRunesKeyword) {
                if (currentDivinationType === 'tarot') {
                    enhancedMessage = `Give me a tarot reading: ${messageText}`;
                } else if (currentDivinationType === 'iching') {
                    enhancedMessage = `Give me an I Ching reading: ${messageText}`;
                } else if (currentDivinationType === 'runes') {
                    enhancedMessage = `Give me a runes reading: ${messageText}`;
                }
            }

            addMessage(messageText, true); // Show user's original message
            sounds.messageSend();
            userInput.value = '';
            showThinkingAnimation();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: enhancedMessage, // Send enhanced message with divination type
                        spread_type: currentSpreadType
                    }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                hideThinkingAnimation();

                currentReading = data;

                // Display visualizations based on reading type
                if (data.type === 'tarot' && data.cards) {
                    displayTarotCards(data.cards, data.positions);
                } else if (data.type === 'iching' && data.hexagram) {
                    displayHexagram(data.hexagram);
                } else if (data.type === 'runes' && data.runes) {
                    displayRunes(data.runes, data.positions);
                }

                addMessage(data.response, false);

                if (data.terminate) {
                    userInput.disabled = true;
                    generateBtn.disabled = true;
                }
            } catch (error) {
                hideThinkingAnimation();
                console.error('Chat Error:', error);
                addMessage(`Error: ${error.message}. Please try again.`, false);
            }
        }

        // Export Reading
        function exportReading() {
            html2canvas(cardViewerContent).then(canvas => {
                const link = document.createElement('a');
                link.download = 'oracle-reading.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // Initialize Chat
        async function initializeChat() {
            try {
                showThinkingAnimation();
                const response = await fetch('/init');
                const data = await response.json();
                hideThinkingAnimation();
                addMessage(data.response, false);
            } catch (error) {
                console.error('Initialization Error:', error);
                hideThinkingAnimation();
                addMessage('Failed to initialize chat. Please refresh the page.', false);
            }
        }

        // Load Saved Preferences
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.setAttribute('data-theme', 'light');
            themeToggle.textContent = '☀️';
        }

        const savedSound = localStorage.getItem('soundEnabled');
        if (savedSound !== null) {
            soundEnabled = savedSound === 'true';
            if (!soundEnabled) {
                soundToggle.classList.add('muted');
                soundToggle.textContent = '🔇';
            }
        }

        const savedMusic = localStorage.getItem('musicEnabled');
        if (savedMusic === 'true') {
            musicEnabled = true;
            musicToggle.classList.remove('muted');
            musicToggle.textContent = '🎵';
        }

        // Initialize
        updateSelectionPills();
        initializeChat();

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768 && sidebarOpen &&
                !sidebar.contains(e.target) &&
                !hamburger.contains(e.target)) {
                toggleSidebar();
            }
        });
    </script>
</body>
</html>
