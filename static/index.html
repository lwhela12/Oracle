<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quantum Oracle — Ancient Divination Powered by Quantum Entropy</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <meta name="theme-color" content="#12111a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quantum Oracle">

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0d0c14;
            --bg-secondary: rgba(22, 20, 32, 0.85);
            --bg-card: #1f1c2e;
            --bg-bot: #272338;
            --bg-input: rgba(26, 23, 38, 0.95);
            --text-primary: #ede8f5;
            --text-secondary: #b8b0c8;
            --text-muted: #857c98;
            --accent-gold: #e5c158;
            --accent-primary: #b388ff;
            --accent-secondary: #8c54ff;
            --border-color: rgba(179, 136, 255, 0.18);
            --border-glow: rgba(179, 136, 255, 0.35);
            --card-back: linear-gradient(135deg, #372957 0%, #1c1533 100%);
            --card-front: linear-gradient(135deg, #2a243d 0%, #1e192c 100%);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        [data-theme="light"] {
            --bg-primary: #f6f5fb;
            --bg-secondary: rgba(255, 255, 255, 0.92);
            --bg-card: #eceaf4;
            --bg-bot: #e2dfef;
            --bg-input: rgba(255, 255, 255, 0.96);
            --text-primary: #211c2e;
            --text-secondary: #4a4458;
            --text-muted: #79718a;
            --accent-gold: #b3820a;
            --accent-primary: #7c4dff;
            --accent-secondary: #651fff;
            --border-color: rgba(124, 77, 255, 0.18);
            --border-glow: rgba(124, 77, 255, 0.35);
            --card-back: linear-gradient(135deg, #d8d0ee 0%, #bdb3db 100%);
            --card-front: linear-gradient(135deg, #ffffff 0%, #f0edfa 100%);
            --shadow: 0 8px 32px rgba(90, 70, 130, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(179, 136, 255, 0.14) 0%, transparent 55%),
                radial-gradient(circle at 100% 100%, rgba(102, 126, 234, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(229, 193, 88, 0.05) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-size: 18px;
            line-height: 1.6;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Top Navigation Bar */
        .oracle-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(13, 12, 20, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
        }

        [data-theme="light"] .oracle-nav {
            background: rgba(246, 245, 251, 0.88);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .nav-icon {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 8px rgba(179, 136, 255, 0.5));
        }

        .nav-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 7px 14px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px var(--border-glow);
            transform: translateY(-1px);
        }

        .nav-btn.muted {
            opacity: 0.55;
        }

        @media (max-width: 600px) {
            .nav-btn-label {
                display: none;
            }
            .nav-btn {
                padding: 6px 10px;
                font-size: 16px;
            }
            .nav-title {
                font-size: 17px;
            }
        }

        /* Header Hero Banner */
        .hero-banner {
            width: 100%;
            max-height: 180px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid var(--border-color);
            background: #000;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to top, var(--bg-primary), transparent);
            pointer-events: none;
        }

        .hero-banner picture,
        .hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        @media (max-width: 768px) {
            .hero-banner {
                max-height: 110px;
            }
        }

        /* Main App Container */
        .main-container {
            width: 95%;
            max-width: 1400px;
            margin: 20px auto 40px;
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
            gap: 24px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                margin-top: 12px;
                margin-bottom: 20px;
                gap: 18px;
            }
        }

        /* Divination Display Area */
        .card-spread-area {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 400px;
        }

        .spread-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spread-title-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .spread-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: var(--accent-primary);
            text-shadow: 0 0 16px rgba(179, 136, 255, 0.25);
            letter-spacing: 1px;
        }

        .export-btn {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 14px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .export-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }

        /* Spread Selector Tabs */
        .spread-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .spread-option {
            padding: 6px 14px;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            cursor: pointer;
            font-size: 15px;
            font-family: 'Cormorant Garamond', serif;
            transition: all 0.2s;
            user-select: none;
        }

        .spread-option:hover {
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }

        .spread-option.active {
            background: var(--accent-secondary);
            color: #ffffff;
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px rgba(140, 84, 255, 0.4);
        }

        /* Cards & Divination Display Container */
        .cards-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            position: relative;
        }

        .empty-spread {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
        }

        .empty-spread-icon {
            font-size: 64px;
            margin-bottom: 12px;
            opacity: 0.45;
            filter: drop-shadow(0 0 12px rgba(179, 136, 255, 0.3));
        }

        /* Responsive Tarot Cards Grid & Carousel */
        .tarot-grid {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 10px 0;
        }

        /* Horizontal Carousel on Mobile */
        @media (max-width: 768px) {
            .tarot-grid {
                flex-wrap: nowrap;
                justify-content: flex-start;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
                padding: 16px 12px;
                gap: 16px;
            }

            .tarot-card-wrapper {
                scroll-snap-align: center;
                flex-shrink: 0;
            }

            .cards-container {
                min-height: auto;
            }

            .card-spread-area {
                min-height: auto;
                padding: 18px 14px;
            }
        }

        /* 3D Tarot Card */
        .tarot-card-wrapper {
            perspective: 1000px;
            width: 130px;
            height: 220px;
        }

        .tarot-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .tarot-card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: var(--radius-md);
            border: 2px solid var(--accent-gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 14px 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            user-select: none;
        }

        .card-back {
            background: var(--card-back);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card-back::before {
            content: '✦';
            font-size: 38px;
            color: var(--accent-gold);
            opacity: 0.6;
            animation: pulseStar 3s infinite ease-in-out;
        }

        @keyframes pulseStar {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }

        .card-front {
            background: var(--card-front);
            transform: rotateY(180deg);
            text-align: center;
        }

        .card-position {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-primary);
        }

        .card-icon {
            font-size: 42px;
            line-height: 1;
            margin: 6px 0;
            filter: drop-shadow(0 0 8px rgba(229, 193, 88, 0.3));
        }

        .card-name {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .card-suit {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Celtic Cross Layout on Desktop */
        .celtic-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .celtic-grid {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
            }
        }

        /* I Ching Hexagram Display */
        .hexagram-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 24px;
            text-align: center;
        }

        .hexagram-symbol {
            font-size: 100px;
            line-height: 1;
            color: var(--accent-primary);
            text-shadow: 0 0 24px rgba(179, 136, 255, 0.4);
        }

        .hexagram-name {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: var(--accent-gold);
            margin-bottom: 4px;
        }

        .hexagram-meta {
            font-size: 15px;
            color: var(--text-secondary);
        }

        .hexagram-changing {
            color: var(--accent-primary);
            font-size: 15px;
            margin-top: 8px;
        }

        /* Rune Stones Display */
        .runes-grid {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
            padding: 16px;
            width: 100%;
        }

        .rune-stone {
            background: linear-gradient(145deg, #373449 0%, #201e2c 100%);
            border: 2px solid #5a5472;
            border-radius: var(--radius-md);
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 110px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .rune-stone:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(179, 136, 255, 0.2);
        }

        .rune-symbol {
            font-size: 54px;
            color: var(--accent-gold);
            text-shadow: 0 0 14px rgba(229, 193, 88, 0.45);
        }

        .rune-name {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .rune-position {
            font-size: 12px;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .rune-meaning {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Chat / Interpretation Container */
        .chat-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            max-height: 860px;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 1024px) {
            .chat-container {
                height: 580px;
                max-height: none;
            }
        }

        /* Templates Bar */
        .reading-templates {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(18, 16, 26, 0.4);
        }

        .template-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .template-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .template-buttons {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .template-btn {
            white-space: nowrap;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 6px 14px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .template-btn:hover {
            border-color: var(--accent-primary);
            background: var(--bg-bot);
        }

        /* Chat Messages List */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .user-message,
        .bot-message {
            max-width: 88%;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 18px;
            line-height: 1.65;
            word-break: break-word;
            animation: fadeInMsg 0.3s ease-out;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent-secondary) 0%, #5632a8 100%);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 14px rgba(118, 75, 162, 0.3);
        }

        .bot-message {
            align-self: flex-start;
            background: var(--bg-bot);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .bot-message h1, .bot-message h2, .bot-message h3 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            margin: 14px 0 6px;
        }

        .bot-message ul, .bot-message ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        .bot-message p {
            margin-bottom: 10px;
        }

        .bot-message p:last-child {
            margin-bottom: 0;
        }

        .bot-message strong {
            color: var(--accent-primary);
        }

        /* Thinking Indicator */
        .thinking {
            display: none;
            padding: 10px 20px;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 15px;
        }

        .shuffle-animation {
            display: flex;
            gap: 6px;
        }

        .shuffle-card {
            width: 14px;
            height: 22px;
            background: var(--accent-primary);
            border-radius: 3px;
            animation: shufflePulse 1.2s infinite ease-in-out;
        }

        .shuffle-card:nth-child(2) { animation-delay: 0.2s; }
        .shuffle-card:nth-child(3) { animation-delay: 0.4s; }

        @keyframes shufflePulse {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
            50% { transform: translateY(-8px) scale(1.1); opacity: 1; }
        }

        /* Sticky Bottom Chat Input */
        .chat-input-area {
            padding: 14px 16px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-input);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            bottom: 0;
            z-index: 50;
            padding-bottom: max(14px, env(safe-area-inset-bottom));
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-field {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 12px 20px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s;
        }

        .chat-input-field:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 14px var(--border-glow);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-secondary) 0%, #5e35b1 100%);
            color: #ffffff;
            border: none;
            border-radius: 24px;
            padding: 12px 24px;
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(118, 75, 162, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.5);
        }

        .input-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-muted);
        }

        .quick-action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .quick-action-btn:hover {
            color: var(--text-primary);
        }

        /* Reading History Drawer */
        .history-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .history-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .history-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.5);
        }

        .history-drawer.active {
            transform: translateX(0);

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;

        .drawer-close {

            border: none;

        .drawer-close:hover {
            color: var(--text-primary);

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;

        .history-item {
            background: var(--bg-card);

        .history-type-badge {

            color: var(--accent-primary);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            text-transform: uppercase;

        .history-preview {

            color: var(--text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty-history {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="oracle-nav">

                📜 <span class="nav-btn-label">History</span>
            </button>

            <button class="nav-btn" id="sound-btn" onclick="toggleSound()" title="Sound Effects">🔊</button>
            <button class="nav-btn muted" id="music-btn" onclick="toggleMusic()" title="Ambient Drone">🎵</button>

    <!-- Optimized Header Hero Banner with WebP picture -->

    <!-- Main Content Grid -->
    <main class="main-container">
        <!-- Left Pane: Divination Spread Area -->
        <section class="card-spread-area" id="spread-area">
            <div class="spread-header">
                <div class="spread-title-wrap">
                    <h2 class="spread-title" id="spread-title">✦ Divination Portal ✦</h2>
                    <button class="export-btn" id="export-button" onclick="exportReading()">
                        📥 <span>Save Image</span>
                    </button>
                </div>
                <div class="spread-selector">
                    <button class="spread-option active" data-spread="3-card" onclick="selectSpread('3-card')">
                        🔮 3-Card
                    </button>
                    <button class="spread-option" data-spread="yes-no" onclick="selectSpread('yes-no')">
                        ❓ Yes/No
                    </button>
                    <button class="spread-option" data-spread="5-card" onclick="selectSpread('5-card')">
                        ⭐ 5-Card Cross
                    </button>
                    <button class="spread-option" data-spread="celtic" onclick="selectSpread('celtic')">
                        ✨ Celtic Cross
                    </button>
                </div>
            </div>

            <!-- Visualization Canvas for Cards / Hexagram / Runes -->
            <div class="cards-container" id="cards-container">

                </div>

        </section>

        <!-- Right Pane: Chat & Interpretation Area -->
        <section class="chat-container">
            <div class="reading-templates">
                <div class="template-header">
                    <span class="template-title">✨ Divination Inquiries</span>
                </div>
                <div class="template-buttons">
                    <button class="template-btn" onclick="useTemplate('Give me a tarot reading for general guidance', 'tarot')">🔮 Tarot Spread</button>
                    <button class="template-btn" onclick="useTemplate('Cast the I Ching for my question', 'iching')">☯️ I Ching</button>
                    <button class="template-btn" onclick="useTemplate('Cast the runes for my situation', 'runes')">ᚱ Elder Futhark Runes</button>
                    <button class="template-btn" onclick="useTemplate('What cosmic wisdom do I need to hear today?', 'tarot')">📅 Daily Message</button>
                    <button class="template-btn" onclick="useTemplate('Give me a tarot reading about love and relationships', 'tarot')">💕 Love</button>
                    <button class="template-btn" onclick="useTemplate('Give me a tarot reading about my career and calling', 'tarot')">💼 Career</button>
                    <button class="template-btn" onclick="useTemplate('What is the spiritual lesson in my life right now?', 'tarot')">🙏 Spiritual Path</button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="thinking" id="thinking-animation">

            </div>

            <div class="chat-input-area">
                <div class="input-row">

                    <button id="send-button" class="send-btn" onclick="sendMessage()">
                        <span>Send</span> ✨
                    </button>

                        🔗 <span>Share Reading</span>

            </div>
        </section>
    </main>

    <!-- Reading History Slide-over Drawer -->
    <div class="history-overlay" id="history-overlay" onclick="toggleHistory()"></div>
    <aside class="history-drawer" id="history-drawer">
        <div class="drawer-header">
            <h3 class="drawer-title">📜 Divination Journal</h3>
            <button class="drawer-close" onclick="toggleHistory()">&times;</button>
        </div>
        <div class="drawer-body" id="history-list">
            <div class="empty-history">No saved readings yet. Your divination journeys will be preserved here.</div>
        </div>
        <div style="padding: 16px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end;">
            <button class="quick-action-btn" onclick="clearAllHistory()">🗑️ Clear Journal</button>
        </div>
    </aside>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const thinkingAnimation = document.getElementById('thinking-animation');
        const cardsContainer = document.getElementById('cards-container');
        const exportButton = document.getElementById('export-button');
        const spreadTitle = document.getElementById('spread-title');
        const themeBtn = document.getElementById('theme-btn');
        const soundBtn = document.getElementById('sound-btn');
        const musicBtn = document.getElementById('music-btn');
        const historyDrawer = document.getElementById('history-drawer');
        const historyOverlay = document.getElementById('history-overlay');
        const historyList = document.getElementById('history-list');

        let currentReading = null;
        let currentSpreadType = '3-card';
        let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';
        let musicEnabled = localStorage.getItem('musicEnabled') === 'true';
        let audioContext = null;
        let ambientOscillator = null;

        // Session ID Persistence
        let sessionId = sessionStorage.getItem('oracle_session_id');
        if (!sessionId) {
            sessionId = 'session_' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '_' + Math.random().toString(36).substring(2)));
            sessionStorage.setItem('oracle_session_id', sessionId);
        }

        // Web Audio Synthesizer
        function initAudio() {
            if (!audioContext) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) audioContext = new AudioCtx();
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        const sounds = {
            cardFlip: () => {
                if (!soundEnabled) return;
                initAudio();
                if (!audioContext) return;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 420;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.12, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.18);
                osc.start();
                osc.stop(audioContext.currentTime + 0.18);
            },
            cardShuffle: () => {
                if (!soundEnabled) return;
                initAudio();
                if (!audioContext) return;
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = 220 + Math.random() * 80;
                        osc.type = 'triangle';
                        gain.gain.setValueAtTime(0.06, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.09);
                        osc.start();
                        osc.stop(audioContext.currentTime + 0.09);
                    }, i * 45);
                }
            },
            messageSend: () => {
                if (!soundEnabled) return;
                initAudio();
                if (!audioContext) return;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 580;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.08, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.14);
                osc.start();
                osc.stop(audioContext.currentTime + 0.14);
            },
            chime: () => {
                if (!soundEnabled) return;
                initAudio();
                if (!audioContext) return;
                [523.25, 659.25, 783.99].forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freq;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.7);
                        osc.start();
                        osc.stop(audioContext.currentTime + 0.7);
                    }, i * 90);
                });
            }
        };

        // Ambient Drone Music
        function startAmbientMusic() {
            if (!musicEnabled || ambientOscillator) return;
            initAudio();
            if (!audioContext) return;

            ambientOscillator = {
                osc1: audioContext.createOscillator(),
                osc2: audioContext.createOscillator(),
                gain: audioContext.createGain()
            };

            ambientOscillator.osc1.frequency.value = 110;
            ambientOscillator.osc2.frequency.value = 165;
            ambientOscillator.gain.gain.value = 0.025;

            ambientOscillator.osc1.connect(ambientOscillator.gain);
            ambientOscillator.osc2.connect(ambientOscillator.gain);
            ambientOscillator.gain.connect(audioContext.destination);

            ambientOscillator.osc1.start();
            ambientOscillator.osc2.start();
        }

        function stopAmbientMusic() {
            if (ambientOscillator) {
                try {
                    ambientOscillator.osc1.stop();
                    ambientOscillator.osc2.stop();
                } catch(e) {}
                ambientOscillator = null;
            }
        }

        // Controls Toggling
        function toggleSound() {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
            soundBtn.classList.toggle('muted', !soundEnabled);
            localStorage.setItem('soundEnabled', soundEnabled);
            if (soundEnabled) sounds.chime();
        }

        function toggleMusic() {
            musicEnabled = !musicEnabled;
            musicBtn.textContent = musicEnabled ? '🎵' : '🎶';
            musicBtn.classList.toggle('muted', !musicEnabled);
            localStorage.setItem('musicEnabled', musicEnabled);
            if (musicEnabled) startAmbientMusic();
            else stopAmbientMusic();
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            themeBtn.textContent = newTheme === 'light' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        function selectSpread(spreadType) {
            currentSpreadType = spreadType;
            document.querySelectorAll('.spread-option').forEach(opt => {
                opt.classList.toggle('active', opt.getAttribute('data-spread') === spreadType);
            });
            sounds.chime();
        }

        // Initialize Preferences
        if (!soundEnabled) {
            soundBtn.classList.add('muted');
            soundBtn.textContent = '🔇';
        }
        if (musicEnabled) {
            musicBtn.classList.remove('muted');
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.setAttribute('data-theme', 'light');
            themeBtn.textContent = '☀️';
        }

        // Card Visual Icons
        function getCardIcon(card) {
            if (card.arcana === 'major') {
                const majorIcons = {
                    'The Fool': '🃏', 'The Magician': '🎩', 'The High Priestess': '👸',
                    'The Empress': '👑', 'The Emperor': '🤴', 'The Hierophant': '⛪',
                    'The Lovers': '💑', 'The Chariot': '🏇', 'Strength': '🦁',
                    'The Hermit': '🏮', 'Wheel of Fortune': '☸️', 'Justice': '⚖️',
                    'The Hanged Man': '🙃', 'Death': '💀', 'Temperance': '🍷',
                    'The Devil': '😈', 'The Tower': '🗼', 'The Star': '⭐',
                    'The Moon': '🌙', 'The Sun': '☀️', 'Judgement': '📯', 'The World': '🌍'
                };
                return majorIcons[card.name] || '✦';
            } else {
                const suitIcons = { 'Wands': '🔥', 'Cups': '🏆', 'Swords': '⚔️', 'Pentacles': '⭐' };
                return suitIcons[card.suit] || '✦';
            }
        }

        function displayTarotCards(cards, positions) {
            spreadTitle.textContent = '✦ Sacred Tarot Spread ✦';
            cardsContainer.innerHTML = '';
            exportButton.style.display = 'inline-flex';
            sounds.cardShuffle();

            const grid = document.createElement('div');
            grid.className = 'tarot-grid';

            cards.forEach((card, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'tarot-card-wrapper';

                const cardEl = document.createElement('div');
                cardEl.className = 'tarot-card';
                cardEl.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <div class="card-position">${positions[index] || 'Card'}</div>
                        <div class="card-icon">${getCardIcon(card)}</div>
                        <div class="card-name">${card.name}</div>
                        ${card.suit ? `<div class="card-suit">${card.suit}</div>` : ''}
                    </div>
                `;

                wrapper.appendChild(cardEl);
                grid.appendChild(wrapper);

                // Progressive reveal
                setTimeout(() => {
                    cardEl.classList.add('flipped');
                    sounds.cardFlip();
                }, 350 + (index * 220));

                cardEl.addEventListener('click', () => {
                    cardEl.classList.toggle('flipped');
                    sounds.cardFlip();
                });
            });

            cardsContainer.appendChild(grid);
            scrollSpreadIntoViewMobile();
        }

        function displayHexagram(hexagram) {
            spreadTitle.textContent = '✦ I Ching Hexagram ✦';
            cardsContainer.innerHTML = '';
            exportButton.style.display = 'inline-flex';
            sounds.chime();

            const hexDiv = document.createElement('div');
            hexDiv.className = 'hexagram-display';
            hexDiv.innerHTML = `
                <div class="hexagram-symbol">${hexagram.symbol}</div>
                <div class="hexagram-name">Hexagram ${hexagram.number}: ${hexagram.name}</div>
                <div class="hexagram-meta"><em>${hexagram.meaning}</em></div>
                <div class="hexagram-meta" style="margin-top: 4px; color: var(--accent-primary);">${hexagram.keywords}</div>
                ${hexagram.changing_lines && hexagram.changing_lines.length > 0 ?
                    `<div class="hexagram-changing">Changing Lines: ${hexagram.changing_lines.join(', ')}</div>` : ''}
            `;

            cardsContainer.appendChild(hexDiv);
            scrollSpreadIntoViewMobile();
        }

        function displayRunes(runes, positions) {
            spreadTitle.textContent = '✦ Elder Futhark Cast ✦';
            cardsContainer.innerHTML = '';
            exportButton.style.display = 'inline-flex';
            sounds.chime();

            const grid = document.createElement('div');
            grid.className = 'runes-grid';

            runes.forEach((rune, index) => {
                const stone = document.createElement('div');
                stone.className = 'rune-stone';
                stone.innerHTML = `
                    <div class="rune-position">${positions[index] || 'Rune'}</div>
                    <div class="rune-symbol">${rune.symbol}</div>
                    <div class="rune-name">${rune.name}</div>
                    <div class="rune-meaning">${rune.meaning}</div>
                `;
                grid.appendChild(stone);

                setTimeout(() => {
                    sounds.cardFlip();
                }, index * 180);
            });

            cardsContainer.appendChild(grid);
            scrollSpreadIntoViewMobile();
        }

        function scrollSpreadIntoViewMobile() {
            if (window.innerWidth <= 1024) {
                const spreadArea = document.getElementById('spread-area');
                if (spreadArea) {
                    spreadArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }
        }

        // Sanitized Markdown Parser
        function renderMarkdown(raw) {
            const parsed = marked.parse(raw);
            return window.DOMPurify ? DOMPurify.sanitize(parsed) : parsed;
        }

        function addMessage(message, isUser) {
            const el = document.createElement('div');
            el.className = isUser ? 'user-message' : 'bot-message';
            if (isUser) {
                el.textContent = message;
            } else {
                el.innerHTML = renderMarkdown(message);
            }
            chatMessages.appendChild(el);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showThinkingAnimation() {
            thinkingAnimation.style.display = 'flex';
        }

        function hideThinkingAnimation() {
            thinkingAnimation.style.display = 'none';
        }

        // Initialize Chat Session
        async function initializeChat() {
            try {
                showThinkingAnimation();
                const res = await fetch('/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                const data = await res.json();
                hideThinkingAnimation();
                addMessage(data.response, false);
            } catch (err) {
                hideThinkingAnimation();
                addMessage("Welcome, seeker. The Oracle awaits your questions.", false);
            }
        }

        // Send Message with SSE Real-time Streaming
        async function sendMessage(messageText = null, explicitMode = null) {
            const text = messageText || userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            sounds.messageSend();
            if (!messageText) userInput.value = '';
            showThinkingAnimation();

            const botMsgElement = document.createElement('div');
            botMsgElement.className = 'bot-message';
            chatMessages.appendChild(botMsgElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            let fullText = '';
            let isStreamDone = false;

            try {
                const response = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        spread_type: currentSpreadType,
                        mode: explicitMode || null,
                        session_id: sessionId
                    })
                });

                if (response.ok && response.body) {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const events = buffer.split('\n\n');
                        buffer = events.pop();

                        for (const block of events) {
                            if (!block.trim()) continue;
                            const lines = block.split('\n');
                            let eventType = 'message';
                            let dataStr = '';

                            for (const line of lines) {
                                if (line.startsWith('event:')) eventType = line.replace('event:', '').trim();
                                else if (line.startsWith('data:')) dataStr += line.replace('data:', '').trim();
                            }

                            if (!dataStr) continue;
                            try {
                                const parsed = JSON.parse(dataStr);
                                if (eventType === 'metadata') {
                                    currentReading = parsed;
                                    hideThinkingAnimation();
                                    if (parsed.type === 'tarot' && parsed.cards) displayTarotCards(parsed.cards, parsed.positions);
                                    else if (parsed.type === 'iching' && parsed.hexagram) displayHexagram(parsed.hexagram);
                                    else if (parsed.type === 'runes' && parsed.runes) displayRunes(parsed.runes, parsed.positions);
                                } else if (eventType === 'token') {
                                    hideThinkingAnimation();
                                    fullText += parsed.token || '';
                                    botMsgElement.innerHTML = renderMarkdown(fullText);
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                } else if (eventType === 'done') {
                                    hideThinkingAnimation();
                                    isStreamDone = true;
                                    saveReadingToJournal(text, currentReading, fullText);
                                } else if (eventType === 'error') {
                                    hideThinkingAnimation();
                                    botMsgElement.innerHTML = renderMarkdown(`*${parsed.error}*`);
                                    isStreamDone = true;
                                }
                            } catch(e) {}
                        }
                    }
                }
            } catch (streamErr) {
                console.warn('Stream failed, falling back to /chat:', streamErr);
            }

            // Fallback to /chat if stream failed or produced nothing
            if (!isStreamDone && !fullText) {
                try {
                    const res = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: text,
                            spread_type: currentSpreadType,
                            mode: explicitMode || null,
                            session_id: sessionId
                        })
                    });
                    hideThinkingAnimation();
                    const data = await res.json();
                    currentReading = data;
                    if (data.type === 'tarot' && data.cards) displayTarotCards(data.cards, data.positions);
                    else if (data.type === 'iching' && data.hexagram) displayHexagram(data.hexagram);
                    else if (data.type === 'runes' && data.runes) displayRunes(data.runes, data.positions);
                    botMsgElement.innerHTML = renderMarkdown(data.response || '');
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    saveReadingToJournal(text, currentReading, data.response);
                } catch (fallbackErr) {
                    hideThinkingAnimation();
                    botMsgElement.innerHTML = renderMarkdown(`*The Oracle could not be reached: ${fallbackErr.message}*`);
                }
            }
            hideThinkingAnimation();
        }

        function useTemplate(template, mode = null) {
            userInput.value = template;
            sendMessage(template, mode);
        }

        function clearChat() {
            if (confirm('Clear the current conversation?')) {
                fetch('/session/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                }).catch(() => {});

                chatMessages.innerHTML = '';
                cardsContainer.innerHTML = `
                    <div class="empty-spread">
                        <div class="empty-spread-icon">🔮</div>
                        <p>Choose a spread or ask the Oracle a question to reveal your divination.</p>
                    </div>
                `;
                exportButton.style.display = 'none';
                spreadTitle.textContent = '✦ Divination Portal ✦';
                currentReading = null;
                initializeChat();
            }
        }

        // Reading Journal (History) Storage
        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem('oracle_reading_history') || '[]');
            } catch(e) {
                return [];
            }
        }

        function saveReadingToJournal(question, readingData, responseText) {
            if (!readingData || !responseText) return;
            const history = getHistory();
            const entry = {
                id: 'reading_' + Date.now(),
                timestamp: new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                question: question,
                type: readingData.type || 'divination',
                readingData: readingData,
                text: responseText
            };
            history.unshift(entry);
            if (history.length > 20) history.pop();
            localStorage.setItem('oracle_reading_history', JSON.stringify(history));
            renderHistoryDrawer();
        }

        function renderHistoryDrawer() {
            const history = getHistory();
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">No saved readings yet. Your divination journeys will be preserved here.</div>';
                return;
            }

            historyList.innerHTML = '';
            history.forEach(item => {
                const el = document.createElement('div');
                el.className = 'history-item';
                el.innerHTML = `
                    <div class="history-meta">
                        <span class="history-type-badge">${item.type}</span>
                        <span>${item.timestamp}</span>
                    </div>
                    <div style="font-weight: 600; font-size: 16px; margin-bottom: 4px; color: var(--text-primary);">${item.question}</div>
                    <div class="history-preview">${item.text}</div>
                `;
                el.addEventListener('click', () => {
                    loadHistoryItem(item);
                    toggleHistory();
                });
                historyList.appendChild(el);
            });
        }

        function loadHistoryItem(item) {
            currentReading = item.readingData;
            if (item.readingData.type === 'tarot' && item.readingData.cards) {
                displayTarotCards(item.readingData.cards, item.readingData.positions || []);
            } else if (item.readingData.type === 'iching' && item.readingData.hexagram) {
                displayHexagram(item.readingData.hexagram);
            } else if (item.readingData.type === 'runes' && item.readingData.runes) {
                displayRunes(item.readingData.runes, item.readingData.positions || []);
            }
            addMessage(`*Reviewing past inquiry: "${item.question}"*`, true);
            addMessage(item.text, false);
        }

        function clearAllHistory() {
            if (confirm('Clear all recorded journal entries?')) {
                localStorage.removeItem('oracle_reading_history');
                renderHistoryDrawer();
            }
        }

        function toggleHistory() {
            const isActive = historyDrawer.classList.contains('active');
            historyDrawer.classList.toggle('active', !isActive);
            historyOverlay.classList.toggle('active', !isActive);
            if (!isActive) renderHistoryDrawer();
        }

        function shareReading() {
            if (currentReading && currentReading.type === 'tarot') {
                const shareText = `Quantum Oracle Reading:\n\n${currentReading.cards.map((c, i) =>
                    `${currentReading.positions[i] || 'Card'}: ${c.name}`
                ).join('\n')}\n\nRead more at ${window.location.href}`;

                if (navigator.share) {
                    navigator.share({ title: 'My Quantum Oracle Reading', text: shareText, url: window.location.href });
                } else {
                    navigator.clipboard.writeText(shareText);
                    alert('Reading copied to clipboard!');
                }
            } else {
                alert('Ask for a reading first to share your divination!');
            }
        }

        async function exportReading() {
            const canvasEl = document.getElementById('cards-container');
            if (!canvasEl) return;
            try {
                const canvas = await html2canvas(canvasEl, { backgroundColor: '#12111a', scale: 2 });
                const link = document.createElement('a');
                link.download = 'quantum-oracle-reading.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                alert('Could not export image. Please take a screenshot instead.');
            }
        }

        // Enter Key Listener
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        window.addEventListener('load', () => {
            initializeChat();
            renderHistoryDrawer();
        });
    </script>
</body>
</html>
