<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2c1a4d" />
      <stop offset="60%" stop-color="#141124" />
      <stop offset="100%" stop-color="#0a0812" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#fda085" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Celestial Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#purpleGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7" />

  <!-- 8-Pointed Star / Cardinal Points -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.6">
    <line x1="256" y1="56" x2="256" y2="456" />
    <line x1="56" y1="256" x2="456" y2="256" />
    <line x1="115" y1="115" x2="397" y2="397" stroke-dasharray="3 6" />
    <line x1="115" y1="397" x2="397" y2="115" stroke-dasharray="3 6" />
  </g>

  <!-- Mystical Eye Outer Shape -->
  <path d="M 120 256 C 180 160, 332 160, 392 256 C 332 352, 180 352, 120 256 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="7" filter="url(#glow)" />

  <!-- Iris / Crystal Sphere -->
  <circle cx="256" cy="256" r="58" fill="#1b1233" stroke="url(#purpleGrad)" stroke-width="4" />
  <circle cx="256" cy="256" r="42" fill="url(#purpleGrad)" opacity="0.85" filter="url(#glow)" />
  <circle cx="256" cy="256" r="20" fill="#ffffff" opacity="0.9" />

  <!-- Small Stars / Sparkles -->
  <polygon points="256,120 260,135 275,135 263,144 267,159 256,150 245,159 249,144 237,135 252,135" fill="url(#goldGrad)" />
  <polygon points="256,362 260,377 275,377 263,386 267,401 256,392 245,401 249,386 237,377 252,377" fill="url(#goldGrad)" />
  <circle cx="170" cy="180" r="4" fill="#f6d365" />
  <circle cx="342" cy="180" r="4" fill="#f6d365" />
  <circle cx="170" cy="332" r="4" fill="#f6d365" />
  <circle cx="342" cy="332" r="4" fill="#f6d365" />
</svg>
